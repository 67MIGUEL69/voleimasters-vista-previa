<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f0c" />
  <meta name="color-scheme" content="light dark" />
  <title>Voleimasters.cat · Lliga amateur de vòlei</title>
  <meta name="description" content="Classificacions, calendari i marcadors en directe de la lliga amateur de vòlei Voleimasters." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icones/favicon.png" sizes="64x64" />
  <link rel="apple-touch-icon" href="icones/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Pantalla de càrrega: el marcatge va aquí (no al JS) perquè
       aparegui a l'instant, abans que es carregui cap script. -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-halo"></div>
    <div class="splash-logo">
      <div class="splash-logo-img"></div>
      <div class="splash-brillantor"></div>
    </div>
    <div class="splash-barra"></div>
  </div>

  <div id="app" class="app">
    <!-- Capçalera -->
    <header id="topbar" class="topbar"></header>

    <!-- Contingut -->
    <main id="view" class="view"></main>

    <!-- Navegació inferior -->
    <nav id="tabbar" class="tabbar"></nav>
  </div>

  <!-- Capa de diàlegs (confirmacions, toasts) i barra d'avisos
       (instal·lació i versions noves) -->
  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div class="franja-mostra">Còpia de mostra · dades del dia de la captura</div>
  <div id="barra" class="barra" hidden></div>

  <script src="js/instantania.js"></script>
  <script src="js/mostra.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/format.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views-public.js"></script>
  <script src="js/views-equips.js"></script>
  <script src="js/views-compte.js"></script>
  <script src="js/views-fitxa.js"></script>
  <script src="js/views-referee.js"></script>
  <script src="js/views-competicio.js"></script>
  <script src="js/views-admin.js"></script>
  <script src="js/avisos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
